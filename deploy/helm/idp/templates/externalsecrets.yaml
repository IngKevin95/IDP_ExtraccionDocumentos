{{- if .Values.global.externalSecrets.enabled }}
{{- /* Credenciales de runtime sincronizadas desde OpenBao (ESO). Ningun valor sensible vive en values ni en el chart. */}}
{{- $s := .Values.global.platform.secrets }}
{{- range $key, $spec := $s }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $spec.name }}
spec:
  refreshInterval: {{ $.Values.global.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $.Values.global.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $spec.name }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $property := $spec.properties }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $spec.remoteKey }}
        property: {{ $property }}
    {{- end }}
{{- end }}
{{- end }}
