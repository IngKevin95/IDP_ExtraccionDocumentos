{{- if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1" }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: idp-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # coraza.io/enable-waf: "true" # Note: Example annotation for Coraza WAF
spec:
  gatewayClassName: {{ .Values.global.gatewayClassName | default "istio" }}
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: {{ .Values.global.domain }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: idp-gateway-cert
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: idp-routes
spec:
  parentRefs:
    - name: idp-gateway
  hostnames:
    - {{ .Values.global.domain }}
  rules:
    - backendRefs:
        - name: {{ include "idp-common.fullname" (dict "Chart" (dict "Name" "edge-gateway") "Release" .Release "Values" .Values) }}
          port: 8080
{{- end }}
