global:
  domain: idp.local
  image:
    registry: ghcr.io/ingkevin95/idp_extracciondocumentos
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
  service:
    type: ClusterIP
    port: 8080
  metrics:
    enabled: true
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

edgeGateway:
  enabled: true
  image:
    repository: ghcr.io/ingkevin95/idp_extracciondocumentos/edge-gateway
    tag: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

