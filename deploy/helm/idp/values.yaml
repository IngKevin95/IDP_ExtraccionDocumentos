chatService:
  enabled: true
  image:
    repository: ghcr.io/ingkevin95/idp_extracciondocumentos/chat-service
    tag: ""
  # Proveedor de IA del chat (SEC-049): modelos fijados por version (nunca alias "latest"), registrados por respuesta.
  # provider "none" = fallo cerrado (el chat responde 503 hasta configurar uno); "openai" = API compatible con OpenAI
  # (endpoint opcional para gateways/vLLM/Ollama). La clave sale del Secret global.platform.secrets.llm.
  llm:
    provider: none
    model: gpt-4o-mini-2024-07-18
    embeddingModel: text-embedding-3-small
    fallbackModel: ""
    endpoint: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

notificationService:
  enabled: true
  image:
    repository: ghcr.io/ingkevin95/idp_extracciondocumentos/notification-service
    tag: ""
  resources:
