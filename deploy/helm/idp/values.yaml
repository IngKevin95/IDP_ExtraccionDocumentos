global:
  domain: idp.local
  image:
    registry: ghcr.io/ingkevin95/idp_extracciondocumentos
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
  service:
    type: ClusterIP
    port: 8080
  metrics:
    enabled: true
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  # dev-mode de seguridad: SOLO values-local.yaml puede ponerlo en true (lo verifica tools/ci/check_dev_mode.sh).
  devMode: false

  # Proveedores de almacenamiento y KMS (ADR 0032): se inyectan como IDP_STORAGE_PROVIDER e IDP_KMS_PROVIDER.
  # Por defecto s3 + openbao (staging, prod, onprem); los values por nube lo sobreescriben.
  adapters:
    storage: s3
    kms: openbao

  # Nombres de Secret y ExternalSecret (sincronizados desde OpenBao). Los valores sensibles nunca van en values.
  externalSecrets:
    enabled: true
    storeName: openbao-store
    refreshInterval: 1h

  # Configuracion de plataforma consumida por templates/_workload.tpl (todo no sensible).
  platform:
    jwt:
      issuerUri: https://keycloak.idp-platform.svc.cluster.local/realms/idp
      jwkSetUri: https://keycloak.idp-platform.svc.cluster.local/realms/idp/protocol/openid-connect/certs
      # Emisor de plataforma distinto del de tenants (tenant-service).
      platformIssuerUri: https://keycloak.idp-platform.svc.cluster.local/realms/idp-platform
      platformJwkSetUri: https://keycloak.idp-platform.svc.cluster.local/realms/idp-platform/protocol/openid-connect/certs
    kafka:
      # Listener TLS (9093) del cluster Strimzi; cada servicio monta el Secret de su KafkaUser.
      bootstrapServers: idp-kafka-kafka-bootstrap.idp-platform.svc.cluster.local:9093
    openbao:
      address: https://openbao.idp-platform.svc.cluster.local:8200
      # Secret (clave ca.crt) con la CA que firma el certificado de OpenBao.
      caSecret: idp-openbao-ca
    controlDb:
      host: idp-pg-rw.idp-platform.svc.cluster.local
      port: 5432
      name: control_db
      jdbcUrl: jdbc:postgresql://idp-pg-rw.idp-platform.svc.cluster.local:5432/control_db
    tenantDb:
      name: tenant_db
      jdbcUrlTemplate: jdbc:postgresql://idp-pg-rw.idp-platform.svc.cluster.local:5432/tenant_{tenant}
    storage:
      endpoint: ""
    worm:
      bucket: idp-audit-worm
      endpoint: ""
    renderer:
      url: https://renderer.idp.svc.cluster.local
      # Secrets TLS (tls.crt, tls.key, ca.crt) emitidos por cert-manager para el mTLS documento -> renderer.
      serverTlsSecret: idp-renderer-tls
      clientTlsSecret: idp-renderer-client-tls
    secrets:
      controlDb:
        name: idp-control-db-credentials
        remoteKey: idp/control-db
        properties: {username: username, password: password}
      tenantDb:
        name: idp-tenant-db-credentials
        remoteKey: idp/tenant-db
        properties: {username: username, password: password}
      downloadSecret:
        name: idp-download-secret
        remoteKey: idp/document/download
        properties: {secret: secret}
      openbao:
        name: idp-openbao-token
        remoteKey: idp/openbao-client
        properties: {token: token}
      s3:
        name: idp-s3-credentials
        remoteKey: idp/s3
        properties: {ACCESS_KEY_ID: access_key_id, SECRET_ACCESS_KEY: secret_access_key}
      worm:
        name: idp-worm-credentials
        remoteKey: idp/audit-worm
        properties: {ACCESS_KEY_ID: access_key_id, SECRET_ACCESS_KEY: secret_access_key}
      # Secreto de recortes firmados (>= 32 bytes) del review-service.
      reviewCropSecret:
        name: idp-review-crop-secret
        remoteKey: idp/review/crop
        properties: {secret: secret}
      # Semilla (>= 32 bytes) del HMAC del muestreo ciego del quality-service.
      qualityBlindSeed:
        name: idp-quality-blind-seed
        remoteKey: idp/quality/blind-seed
        properties: {seed: seed}
      # Clave del proveedor LLM del chat-service (API compatible con OpenAI); solo hace falta si provider != none.
      llm:
        name: idp-llm-credentials
        remoteKey: idp/chat-llm
        properties: {apiKey: api_key}

edgeGateway:
  enabled: true
  image:
    repository: ghcr.io/ingkevin95/idp_extracciondocumentos/edge-gateway
    tag: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

