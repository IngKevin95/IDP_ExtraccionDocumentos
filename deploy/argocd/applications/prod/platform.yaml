apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-platform-prod
  namespace: argocd
spec:
  project: idp
  source:
    repoURL: 'https://github.com/IngKevin95/IDP_ExtraccionDocumentos.git'
    path: deploy/platform
    directory:
      recurse: true
    targetRevision: main  # fijar a tag de release (vX.Y.Z) en cada despliegue a prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: idp-platform
  syncPolicy:
    # prod: sincronización manual (sin automated); promover fijando targetRevision a un tag vX.Y.Z
