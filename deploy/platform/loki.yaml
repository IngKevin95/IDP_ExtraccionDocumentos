apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 5.41.4
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: s3
        bucketNames:
          chunks: loki-data
          ruler: loki-ruler
          admin: loki-admin
        s3:
          endpoint: idp-seaweedfs.default.svc:8333
          accessKeyId: "${S3_ACCESS_KEY}"
          secretAccessKey: "${S3_SECRET_KEY}"
          s3ForcePathStyle: true
          insecure: true