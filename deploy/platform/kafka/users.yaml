# Write exclusivo por productor (ADR 0029, SEC-052): cada KafkaUser escribe SOLO los topicos de los eventTypes que
# produce segun contracts/events/topology.yaml (mas los *-dlt de los topicos que consume) y lee los que consume.
# renderer y edge-gateway no usan Kafka y no tienen KafkaUser. tools/ci/check_kafka_topics.py valida este fichero.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: document-service
  namespace: idp-platform
  labels:
    strimzi.io/cluster: idp-kafka
  # Productor de documentos.eventos; consume extraccion.eventos y revision.eventos.
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: documentos.eventos, patternType: literal }
        operation: Write
      - resource: { type: topic, name: documentos.eventos, patternType: literal }
        operation: Describe
      - resource: { type: topic, name: auditoria.senales, patternType: literal }
        operation: Write
      - resource: { type: topic, name: auditoria.senales, patternType: literal }
        operation: Describe
      - resource: { type: topic, name: extraccion.eventos, patternType: literal }
        operation: Read
      - resource: { type: topic, name: extraccion.eventos, patternType: literal }
        operation: Describe
      - resource: { type: topic, name: revision.eventos, patternType: literal }
        operation: Read
      - resource: { type: topic, name: revision.eventos, patternType: literal }
        operation: Describe
      - resource: { type: topic, name: extraccion.eventos-dlt, patternType: literal }
        operation: Write
      - resource: { type: topic, name: extraccion.eventos-dlt, patternType: literal }
        operation: Describe
      - resource: { type: topic, name: revision.eventos-dlt, patternType: literal }
        operation: Write
      - resource: { type: topic, name: revision.eventos-dlt, patternType: literal }
        operation: Describe
      - resource: { type: group, name: document-service, patternType: literal }
        operation: Read
      - resource: { type: topic, name: idp.tenant.events, patternType: literal }
        operation: Read
      - resource: { type: topic, name: idp.tenant.events, patternType: literal }
        operation: Describe
      - resource: { type: group, name: document-service-acceso-revocado-, patternType: prefix }
        operation: Read
      - resource: { type: group, name: document-service-pool-evict-, patternType: prefix }
        operation: Read

---
