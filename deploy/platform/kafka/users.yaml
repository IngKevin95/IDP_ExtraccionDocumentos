      - resource: { type: topic, name: dominio.documentos, patternType: literal }
        operation: Write
      - resource: { type: topic, name: dominio.documentos, patternType: literal }
        operation: Read
      - resource: { type: topic, name: dominio.documentos, patternType: literal }
        operation: Describe
      - resource: { type: group, name: quality-service, patternType: literal }
        operation: Read
