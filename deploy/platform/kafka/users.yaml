apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: review-service
  namespace: idp-platform
  labels:
    strimzi.io/cluster: idp-kafka
  # Productor de revision.completada y revision.escalada; consumidor de extraccion.requiere_revision y
  # calidad.muestra_ciega_solicitada (topico dominio.documentos).
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: dominio.documentos, patternType: literal }
        operation: Write
      - resource: { type: topic, name: dominio.documentos, patternType: literal }
        operation: Read
      - resource: { type: topic, name: dominio.documentos, patternType: literal }
        operation: Describe
      - resource: { type: topic, name: auditoria.eventos, patternType: literal }
        operation: Write
      - resource: { type: topic, name: auditoria.eventos, patternType: literal }
        operation: Describe
      - resource: { type: group, name: review-service, patternType: literal }
        operation: Read
---
