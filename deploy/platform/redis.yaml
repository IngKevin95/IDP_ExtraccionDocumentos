apiVersion: databases.spotahome.com/v1
kind: RedisFailover
metadata:
  name: idp-redis
spec:
  sentinel:
    replicas: 3 # 1 en local
  redis:
    replicas: 3 # 1 en local
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
    customConfig:
      - maxmemory-policy allkeys-lru