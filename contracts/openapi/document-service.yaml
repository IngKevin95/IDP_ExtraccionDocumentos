openapi: 3.1.0
info:
  title: Document Service API
  description: API para la ingesta idempotente, gestión de ciclo de vida y purga de documentos u oficios en el IDP Bancario.
  version: 1.0.0
servers:
  - url: https://api.idp.example
    description: Servidor interno (vía edge-gateway)

security:
  - BearerAuth: []

paths:
  /v1/documents:
    post:
      summary: Ingesta un nuevo oficio o documento
      description: Permite cargar un documento binario (PDF, DOCX, PNG, JPG, TIFF) con metadatos asociados. Realiza verificación de idempotencia por hash SHA-256 y tupla de negocio.
      operationId: ingestDocument
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Clave de idempotencia opcional (máx. 128 caracteres). Reusarla con otro contenido responde 409 DOC_IDEMPOTENCY_KEY_REUSED.
          schema:
            type: string
            maxLength: 128
            example: "a3f1c2d4-7b6e-4c1a-9d52-0e8f3b7a1c64"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - typology
                - radicado
              properties:
                file:
                  type: string
                  format: binary
                  description: Binario del documento (máximo 50MB).
                typology:
                  type: string
                  enum: [EC, EJ, DC, DJ]
                  example: EC
                  description: Tipología de oficio de embargo/desembargo.
                radicado:
                  type: string
                  example: "11001400300120260012300"
                  description: Número de radicado de 23 dígitos.
                version:
                  type: integer
                  default: 1
                  example: 1
                  description: Versión del documento.
                classification:
                  type: string
                  enum: [PUBLICO, INTERNO, CONFIDENCIAL, ALTAMENTE_CONFIDENCIAL]
                  default: CONFIDENCIAL
                  example: CONFIDENCIAL
      responses:
        '201':
          description: Documento ingresado exitosamente y enviado a procesamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '200':
          description: Documento ya existente (idempotente). Retorna el estado actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          description: Solicitud inválida (metadatos faltantes o mal formados).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El usuario no posee el rol Operador o Administrador de Tenant vigente (DOC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Conflicto. DOC_IDEMPOTENCY_KEY_REUSED (la Idempotency-Key ya se usó con otro contenido) o
            DOC_DUPLICATE_BUSINESS_KEY (ya existe un documento con la misma tipología, radicado y versión y contenido distinto).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Tipo de contenido o magic bytes no soportados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Archivo excede el límite de tamaño o no supera validaciones de formato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Lista documentos con paginación y filtros básicos
      operationId: listDocuments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '403':
          description: El usuario no posee un rol con acceso a documentos (DOC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Lista paginada de documentos.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - limit
                  - offset
                  - total
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentResponse'
                  limit:
                    type: integer
                    example: 20
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 150

  /v1/documents/{documentId}:
    get:
      summary: Obtiene metadatos de un documento
      operationId: getDocumentById
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      responses:
        '200':
          description: Metadatos del documento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '403':
          description: El usuario no posee un rol con acceso a documentos (DOC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Documento no encontrado, no pertenece al tenant (SEC-003) o es Altamente Confidencial de otro cargador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Elimina un documento por Habeas Data (Purga)
      description: Requiere rol Administrador de Tenant. Dispara la purga física de los binarios cifrados en Object Storage y aplica tombstone en BD.
      operationId: deleteDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      responses:
        '204':
          description: Purga ejecutada exitosamente.
        '403':
          description: Requiere rol Administrador de Tenant (DOC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Documento no encontrado o no pertenece al tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/documents/{documentId}/download:
    get:
      summary: Genera un enlace firmado de corta vida para descargar el archivo original
      description: Los objetos están cifrados con sobre, por lo que no se emite una URL presignada del bucket. El enlace apunta a GET /v1/documents/{documentId}/content con vencimiento (exp) y firma HMAC (sig).
      operationId: getDownloadUrl
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      responses:
        '200':
          description: Presigned URL generada.
          content:
            application/json:
              schema:
                type: object
                required:
                  - downloadUrl
                  - expiresAt
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                    example: "https://api.idp.example/v1/documents/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d/content?exp=1791115500&sig=4f2a9c0e7d"
                  expiresAt:
                    type: string
                    format: date-time
                    example: "2026-10-04T12:15:00Z"
        '403':
          description: El usuario no posee un rol con acceso a documentos (DOC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Documento no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/documents/{documentId}/content:
    get:
      summary: Descarga el archivo original descifrado mediante el enlace firmado
      description: Destino del enlace devuelto por /download. Exige JWT del mismo tenant, además de exp y sig válidos.
      operationId: getDocumentContent
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        - name: exp
          in: query
          required: true
          description: Vencimiento del enlace en epoch seconds.
          schema:
            type: integer
            format: int64
            example: 1791115500
        - name: sig
          in: query
          required: true
          description: Firma HMAC-SHA256 (hex) de tenant, documento y vencimiento.
          schema:
            type: string
            example: "4f2a9c0e7d1b8a3c5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5"
      responses:
        '200':
          description: Contenido binario del documento con su tipo MIME original.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/tiff:
              schema:
                type: string
                format: binary
        '403':
          description: Enlace vencido o con firma inválida, o rol sin acceso (DOC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Documento no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/documents/{documentId}/approve-confidential:
    post:
      summary: Aprobación por Data Steward para documentos Altamente Confidenciales
      description: Solo aplica a documentos en estado APROBADO_PENDIENTE_STEWARD. El Data Steward debe ser distinto de quien cargó el documento.
      operationId: approveConfidentialDocument
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      responses:
        '200':
          description: Aprobación otorgada y estado transitado a APROBADO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '403':
          description: El usuario no posee el rol Data Steward o es quien cargó el documento (DOC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Documento no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El documento no está pendiente de aprobación (DOC_INVALID_STATE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DocumentStatus:
      type: string
      description: Estados canónicos (docs/arquitectura.md). APROBADO_PENDIENTE_STEWARD aplica a documentos ALTAMENTE_CONFIDENCIAL pendientes de aprobación del Data Steward.
      enum:
        - RECIBIDO
        - RECHAZADO
        - RENDERIZADO
        - EN_EXTRACCION
        - EN_REVISION
        - APROBADO_PENDIENTE_STEWARD
        - APROBADO
        - FALLIDO

    DocumentResponse:
      type: object
      required:
        - id
        - tenantId
        - hashSha256
        - typology
        - radicado
        - version
        - status
        - classification
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
        tenantId:
          type: string
          format: uuid
          example: "3f8e1c52-6a47-4d0b-9c1e-5b2a7d9e4f10"
        hashSha256:
          type: string
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        typology:
          type: string
          example: "EC"
        radicado:
          type: string
          example: "11001400300120260012300"
        version:
          type: integer
          example: 1
        status:
          $ref: '#/components/schemas/DocumentStatus'
        classification:
          type: string
          example: "CONFIDENCIAL"
        createdAt:
          type: string
          format: date-time
          example: "2026-10-04T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-10-04T10:05:00Z"

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
        - timestamp
      properties:
        errorCode:
          type: string
          enum:
            - DOC_INVALID_FORMAT
            - DOC_FILE_TOO_LARGE
            - DOC_INVALID_METADATA
            - DOC_NOT_FOUND
            - DOC_FORBIDDEN
            - DOC_IDEMPOTENCY_KEY_REUSED
            - DOC_DUPLICATE_BUSINESS_KEY
            - DOC_INVALID_STATE
            - DOC_HTTP_ERROR
            - DOC_INTERNAL_ERROR
          example: "DOC_INVALID_FORMAT"
        message:
          type: string
          example: "El formato o la firma de cabecera (magic bytes) del archivo no es permitido."
        timestamp:
          type: string
          format: date-time
          example: "2026-10-04T10:00:00Z"
