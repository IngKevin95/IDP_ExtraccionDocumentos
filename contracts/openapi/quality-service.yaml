openapi: 3.1.0
info:
  title: Quality Service API
  description: API interna para consulta de métricas de calidad (STP, Hitl, Error Silente) y gestión del Golden Set.
  version: 1.0.0

servers:
  - url: https://api.idp.example
    description: API Gateway
paths:
  /v1/quality/reports/stp:
    get:
      summary: Consultar métricas de STP
      description: Retorna el histórico de procesamiento STP vs intervenciones HITL agrupado por día.
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: tipologia
          in: query
          schema:
            type: string
            enum: [EC, EJ, DC, DJ]
      responses:
        '200':
          description: Métricas agregadas de la serie temporal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              example:
                tenant_id: "tenant-demo-1"
                data:
                  - date: "2026-10-01"
                    total_documents: 1000
                    stp_count: 850
                    hitl_count: 150
                    stp_percentage: 85.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/quality/reports/silent-error:
    get:
      summary: Consultar Error Silente
      description: Retorna la tasa de error silente detectada a través del muestreo ciego (blind sampling).
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Tasa histórica de errores silentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SilentErrorResponse'
              example:
                tenant_id: "tenant-demo-1"
                data:
                  - date: "2026-10-01"
                    blind_samples_total: 20
                    silent_errors_found: 1
                    silent_error_percentage: 5.0
                    drift_detected: false

  /v1/quality/reports/golden-set:
    get:
      summary: Listar documentos del Golden Set
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de oficios ficticios utilizados para calibración.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoldenSetDocument'
    post:
      summary: Crear documento ficticio
      description: Exige sintetico=true, igual que el import por archivo (RN-07); sin la marca responde 400. Se registra el origen API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoldenSetDocumentInput'
      responses:
        '201':
          description: Documento creado (origen API).
        '400':
          description: Documento invalido o sin la marca sintetico=true.

  /v1/quality/reports/golden-set/evaluate:
    post:
      summary: Disparar evaluación de calibración
      description: Ejecuta los prompts de extracción sobre el Golden Set para medir precisión sin afectar operación real.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Proceso iniciado de forma asíncrona.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
              example:
                job_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

  /v1/quality/reports/golden-set/{id}:
    get:
      summary: Obtener un oficio ficticio del Golden Set
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Oficio ficticio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldenSetDocument'
        '404':
          description: No existe en el tenant del token.
    delete:
      summary: Eliminar un oficio ficticio del Golden Set
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Eliminado.
        '404':
          description: No existe en el tenant del token.

  /v1/quality/reports/golden-set/import:
    post:
      summary: Importar verdad terreno generada por tools/synthetic-oficios
      description: Lee los JSON del directorio configurado en el servidor (nunca una ruta del cliente). Cada archivo exige sintetico=true.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cantidad de oficios importados (idempotente por id externo).
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        '400':
          description: Archivo no sintetico o invalido; no se importa nada.

  /v1/quality/reports/golden-set/replay:
    post:
      summary: Replay de un modelo o prompt candidato en paralelo con el vigente
      description: Solo lee el Golden Set y no modifica metricas ni umbrales de produccion.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_model_prompt_key]
              properties:
                baseline_model_prompt_key:
                  type: string
                candidate_model_prompt_key:
                  type: string
      responses:
        '202':
          description: Replay encolado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid

  /v1/quality/reports/golden-set/evaluations/{id}:
    get:
      summary: Estado y resultado de una evaluacion o replay
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado (QUEUED, RUNNING, DONE, FAILED) con accuracy, precision, recall, f1, ECE y detalle por campo.
        '404':
          description: No existe en el tenant del token.

  /v1/quality/reports/fields:
    get:
      summary: Tasa de correccion humana por campo y precision/recall del Golden Set
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: tipologia
          in: query
          schema:
            type: string
            enum: [EC, EJ, DC, DJ]
      responses:
        '200':
          description: Correcciones por campo (HITL y muestreo ciego).

  /v1/quality/reports/performance:
    get:
      summary: Costo y latencia p95 con muestra minima
      description: El p95 solo se publica si hay muestra minima (sufficient=true).
      security:
        - bearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: tipologia
          in: query
          schema:
            type: string
            enum: [EC, EJ, DC, DJ]
      responses:
        '200':
          description: Muestras, p95 de latencia y costo.

  /v1/quality/calibration/thresholds:
    get:
      summary: Umbrales tau_auto y tau_revisar calibrados por par modelo+prompt
      description: Calculados por precision objetivo sobre el Golden Set con calibracion isotonica. attainable=false significa nunca auto-aprobar.
      security:
        - bearerAuth: []
      parameters:
        - name: model_prompt_key
          in: query
          schema:
            type: string
        - name: tipologia
          in: query
          schema:
            type: string
            enum: [EC, EJ, DC, DJ]
      responses:
        '200':
          description: Umbrales por tipologia y campo.

  /v1/quality/blind-samples/pending:
    get:
      summary: Estado agregado de la cola de revision ciega
      description: Solo conteos y antiguedad (SEC-051). Nunca devuelve identificadores de documento ni de muestra, para que el muestreo no sea predecible por operadores.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conteos agregados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
                  reviewed:
                    type: integer
                  pending_by_age:
                    type: object
                    properties:
                      lt_1d:
                        type: integer
                      '1d_7d':
                        type: integer
                      gt_7d:
                        type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MetricsResponse:
      type: object
      properties:
        tenant_id:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              total_documents:
                type: integer
              stp_count:
                type: integer
              hitl_count:
                type: integer
              stp_percentage:
                type: number
                format: float

    SilentErrorResponse:
      type: object
      properties:
        tenant_id:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              blind_samples_total:
                type: integer
              silent_errors_found:
                type: integer
              silent_error_percentage:
                type: number
                format: float
              drift_detected:
                type: boolean

    GoldenSetDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipologia:
          type: string
        tags:
          type: array
          items:
            type: string
        payload_sintetico_json:
          type: object
          description: Mapa llave-valor con la extracción perfecta esperada.

    GoldenSetDocumentInput:
      type: object
      required:
        - nombre
        - tipologia
        - sintetico
        - payload_sintetico_json
      properties:
        sintetico:
          type: boolean
          enum: [true]
          description: Marca obligatoria de dato sintetico (RN-07).
        id:
          type: string
          description: Id externo opcional (se genera uno si falta).
        nombre:
          type: string
          example: "Oficio Ficticio EC - Caso Base"
        tipologia:
          type: string
          enum: [EC, EJ, DC, DJ]
        payload_sintetico_json:
          type: object
          example:
            radicado: "11001202300000000000001"
            monto: 500000.00
        tags:
          type: array
          items:
            type: string

  responses:
    Unauthorized:
      description: Token inválido o ausente.
    Forbidden:
      description: Permisos insuficientes (requiere rol Data Steward).