openapi: 3.1.0
info:
  title: IDP Notification Service API
  version: 1.0.0
  description: |
    API para la gestión de webhooks del tenant en la plataforma de Extracción Documental.
    Permite al integrador bancario registrar URLs para recibir callbacks seguros cuando la
    extracción de oficios finaliza.
servers:
  - url: https://api.idp.example
    description: Entorno de producción (Gateway)
paths:
  /v1/webhooks:
    post:
      summary: Registrar nuevo webhook
      operationId: createWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: Webhook creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: Listar webhooks del tenant
      operationId: listWebhooks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Lista de webhooks. Para el rol OPERADOR la ruta de `url` va enmascarada (`https://host/***`); TENANT_ADMIN ve la URL completa."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /v1/webhooks/{webhookId}:
    delete:
      summary: Eliminar webhook
      operationId: deleteWebhook
      security:
        - bearerAuth: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/{webhookId}/secret/rotate:
    post:
      summary: Iniciar rotación del secreto HMAC
      description: |
        Genera un secreto nuevo (mostrado una sola vez) y deja el anterior activo hasta `previousSecretExpiresAt`
        o hasta `DELETE .../secret/previous`. Durante la rotación cada envío lleva una firma por secreto en
        `X-Hub-Signature-256` (separadas por coma).
      operationId: rotateWebhookSecret
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Secreto nuevo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRotationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/webhooks/{webhookId}/secret/previous:
    delete:
      summary: Cerrar la rotación revocando el secreto anterior
      operationId: revokePreviousWebhookSecret
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '204':
          description: Secreto anterior revocado
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/webhooks/policy:
    get:
      summary: Política del tenant (allowlist de hosts y reintentos)
      operationId: getWebhookPolicy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Política vigente (por defecto, sin hosts permitidos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPolicy'
    put:
      summary: Actualizar la política del tenant
      operationId: updateWebhookPolicy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPolicy'
      responses:
        '200':
          description: Política actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/webhooks/{webhookId}/deliveries:
    get:
      summary: Historial de entregas del webhook
      operationId: listWebhookDeliveries
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDIENTE, ENTREGADO, FALLIDO, CANCELADO]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Página de entregas (la más reciente primero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/webhooks/{webhookId}/deliveries/{deliveryId}/retry:
    post:
      summary: Reintento manual de una entrega fallida (DLT)
      operationId: retryWebhookDelivery
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WebhookId'
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: "Entrega reencolada (PENDIENTE, contador de intentos en cero). Tope de 3 reintentos manuales por entrega: el siguiente responde 409 WEBHOOK_RETRY_LIMIT_REACHED."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    WebhookCreateRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: "URL destino: HTTPS, puerto 443 (otros solo si la plataforma los habilita), host en la allowlist del tenant (PUT /v1/webhooks/policy), sin credenciales (userinfo), sin query string ni IP literal. Se revalida (anti-SSRF, DNS fijado) en cada envío; un destino que resuelva a red privada falla con SSRF_BLOCKED."
          example: "https://core.banco.com/api/webhooks/idp"
        events:
          type: array
          items:
            type: string
            enum:
              - extraccion.aprobada
              - documento.rechazado
              - revision.completada
          minItems: 1
    
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        secret:
          type: string
          description: "Secreto HMAC-SHA256 asignado. Solo se retorna en la creación."
          example: "c2VjcmV0by1kZS1lamVtcGxvLW5vLXJlYWw"
        createdAt:
          type: string
          format: date-time
          
    WebhookListResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        rotating:
          type: boolean
          description: true mientras el secreto anterior sigue activo.
        previousSecretExpiresAt:
          type: string
          format: date-time
          nullable: true

    WebhookRotationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        secret:
          type: string
          description: "Secreto nuevo. Solo se retorna en esta respuesta."
        previousSecretExpiresAt:
          type: string
          format: date-time

    WebhookPolicy:
      type: object
      required: [allowedHosts, maxAttempts, initialBackoffSeconds, backoffMultiplier, maxBackoffSeconds]
      properties:
        allowedHosts:
          type: array
          maxItems: 50
          description: "Hosts receptores permitidos: exacto o comodín `*.dominio` (subdominios, no el apex). Vacío = ningún destino. Se rechazan (400 WEBHOOK_HOST_PUBLIC_SUFFIX) etiquetas únicas, sufijos públicos y comodines sobre ellos (`*.com`, `*.co.uk`, `*.github.io`). Todo host nuevo exige prueba de propiedad del dominio (409 WEBHOOK_HOST_UNVERIFIED: publicar el TXT `_idp-verify.<dominio>` = `idp-verify=<token>` indicado en el mensaje y repetir el PUT; modo de plataforma idp.notification.host-verification=dns|platform; con platform, 409 WEBHOOK_HOST_PENDING_PLATFORM_APPROVAL hasta que la plataforma apruebe el host). Los hosts ya activos no se reverifican."
          items:
            type: string
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 10
        initialBackoffSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          description: "Mínimo 30 s: ningún tenant puede configurar un martilleo rápido sobre un tercero."
        backoffMultiplier:
          type: number
          minimum: 1
          maximum: 10
        maxBackoffSeconds:
          type: integer
          maximum: 86400

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: "Id estable de la entrega; se envía como X-Hub-Event-Id y como `id` del cuerpo (clave de deduplicación del receptor)."
        webhookId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        eventType:
          type: string
        status:
          type: string
          enum: [PENDIENTE, ENTREGADO, FALLIDO, CANCELADO]
        attempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        lastHttpStatus:
          type: integer
          nullable: true
        errorCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    WebhookDeliveryPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    WebhookOutboundPayload:
      type: object
      description: |
        Cuerpo del POST saliente (claim-check, sin PII). Cabeceras: `X-Hub-Timestamp` (epoch segundos),
        `X-Hub-Event-Id` (= `id`), `X-Hub-Signature-256` = `sha256=` + HMAC-SHA256(secreto, timestamp + cuerpo), una
        firma por secreto activo separadas por coma. El receptor debe rechazar timestamps fuera de su ventana y
        deduplicar por `id`.
      required: [id, eventType, occurredAt, documentId, status]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum: [extraccion.aprobada, documento.rechazado, revision.completada]
        occurredAt:
          type: string
          format: date-time
        documentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [APROBADA, RECHAZADO, REVISION_APROBADO, REVISION_RECHAZADO]
        reasonCode:
          type: string
          description: Solo en documento.rechazado.

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Código interno de taxonomía de error.
          example: "VAL-001"
        message:
          type: string
        details:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Error de validación en la solicitud
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token faltante, expirado o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Rol insuficiente o token sin tenant válido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Estado incompatible con la operación (rotación en curso, entrega no fallida, límite de suscripciones)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
