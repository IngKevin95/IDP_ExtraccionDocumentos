openapi: 3.1.0
info:
  title: IDP Notification Service API
  version: 1.0.0
  description: |
    API para la gestión de webhooks del tenant en la plataforma de Extracción Documental.
    Permite al integrador bancario registrar URLs para recibir callbacks seguros cuando la
    extracción de oficios finaliza.
servers:
  - url: https://api.idp.example
    description: Entorno de producción (Gateway)
paths:
  /v1/webhooks:
    post:
      summary: Registrar nuevo webhook
      operationId: createWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: Webhook creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: Listar webhooks del tenant
      operationId: listWebhooks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  
  /v1/webhooks/{webhookId}:
    delete:
      summary: Eliminar webhook
      operationId: deleteWebhook
      security:
        - bearerAuth: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    WebhookCreateRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: "URL destino (debe ser HTTPS, IP pública). SSRF loopback será rechazado asíncronamente."
          example: "https://core.banco.com/api/webhooks/idp"
        events:
          type: array
          items:
            type: string
            enum:
              - extraccion.aprobada
              - documento.rechazado
          minItems: 1
    
    WebhookResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        secret:
          type: string
          description: "Secreto HMAC-SHA256 asignado. Solo se retorna en la creación."
          example: "sk_live_1234567890abcdef"
        createdAt:
          type: string
          format: date-time
          
    WebhookListResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Código interno de taxonomía de error.
          example: "VAL-001"
        message:
          type: string
        details:
          type: array
          items:
            type: string

  responses:
    BadRequest:
      description: Error de validación en la solicitud
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token faltante, expirado o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
