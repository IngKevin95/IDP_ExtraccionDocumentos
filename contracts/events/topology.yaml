# Fuente unica de verdad de la topologia de eventos (ADR 0029, SEC-052).
# Formato: una entrada por linea (flow style), parseable sin dependencias por tools/ci/check_kafka_topics.py.
# Por eventType: topic (unico), producers (servicios con Write sobre ese topico) y key (clave de particion).
# Regla: un topico por productor o familia; solo audit.events admite varios productores (senales de
# seguridad/metering, que audit-service trata como senales y no como estado autoritativo).
# libs/events empaqueta este fichero y lo expone como EventTopology; tools/ci/check_kafka_topics.py lo valida
# contra los esquemas, topics.yaml y users.yaml.
topics:
  document.events: { owner: document-service, key: documentId }
  extraction.events: { owner: extraction-service, key: documentId }
  review.events: { owner: review-service, key: documentId }
  quality.events: { owner: quality-service, key: documentId }
  notification.events: { owner: notification-service, key: documentId }
  idp.tenant.events: { owner: tenant-service, key: tenantId }
  audit.events: { owner: shared, key: tenantId }

eventTypes:
  documento.recibido: { topic: document.events, producers: [document-service], key: documentId }
  documento.rechazado: { topic: document.events, producers: [document-service], key: documentId }
  documento.renderizado: { topic: document.events, producers: [document-service], key: documentId }
  documento.purgado: { topic: document.events, producers: [document-service], key: documentId }
  extraccion.solicitada: { topic: document.events, producers: [document-service], key: documentId }
  extraccion.aprobada: { topic: document.events, producers: [document-service], key: documentId }

  extraccion.completada: { topic: extraction.events, producers: [extraction-service], key: documentId }
  extraccion.requiere_revision: { topic: extraction.events, producers: [extraction-service], key: documentId }
  ia.ejecucion_registrada: { topic: extraction.events, producers: [extraction-service], key: documentId }

  revision.completada: { topic: review.events, producers: [review-service], key: documentId }
  revision.escalada: { topic: review.events, producers: [review-service], key: documentId }

  calidad.muestra_ciega_solicitada: { topic: quality.events, producers: [quality-service], key: documentId }

  webhook.entregado: { topic: notification.events, producers: [notification-service], key: documentId }
  webhook.fallido: { topic: notification.events, producers: [notification-service], key: documentId }

  tenant.aprovisionado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  tenant.aprovisionamiento_fallido: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  tenant.baja_iniciada: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  # Reservado (desalojo de pool por rotacion de credenciales, H7): aun sin esquema en el catalogo.
  tenant.credenciales_rotadas: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  acceso.revocado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  acceso.rol_sensible_otorgado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  breakglass.otorgado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  breakglass.expirado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  cuota.umbral_alcanzado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }

  # Excepcion documentada: senales con varios productores reales. audit-service las ingiere como senales.
  consumo.registrado: { topic: audit.events, producers: [tenant-service, extraction-service], key: tenantId }
  legalhold.aplicado: { topic: audit.events, producers: [tenant-service, audit-service], key: tenantId }
  legalhold.liberado: { topic: audit.events, producers: [tenant-service, audit-service], key: tenantId }
  auditoria.alerta_integridad: { topic: audit.events, producers: [audit-service], key: tenantId }
  seguridad.acceso_denegado: { topic: audit.events, producers: [document-service, extraction-service, review-service, quality-service, notification-service, chat-service, tenant-service], key: tenantId }
  seguridad.prompt_injection_detectado: { topic: audit.events, producers: [extraction-service, chat-service], key: tenantId }
  chat.respuesta_bloqueada: { topic: audit.events, producers: [chat-service], key: tenantId }
  chat.respuesta_desde_cache: { topic: audit.events, producers: [chat-service], key: tenantId }
