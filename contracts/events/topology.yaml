# Fuente unica de verdad de la topologia de eventos (ADR 0029, SEC-052).
# Formato: YAML estandar; lo leen libs/events (EventTopology, SnakeYAML) y tools/ci/check_kafka_topics.py (PyYAML).
# Por eventType: topic (unico), producers (servicios con Write sobre ese topico) y key (clave de particion).
# Por topico: owner (servicio productor unico, o "multi" si es multi-productor), kind (domain | signal | control) y key.
# Reglas: un topico de dominio por productor; solo los topicos multi-productor kind signal (auditoria.senales:
# seguridad.*, chat.*) o kind control (auditoria.control: legalhold.*, consumo.registrado,
# auditoria.alerta_integridad, con productores explicitos por eventType) admiten varios servicios con Write.
# Un topico multi-productor abierto (signal) NO puede contener eventTypes de estado ni de control: un servicio
# comprometido solo podria falsear senales, nunca el estado del dossier probatorio.
# libs/events empaqueta este fichero; tools/ci/check_kafka_topics.py lo valida contra los esquemas, topics.yaml,
# users.yaml y cluster.yaml.
topics:
  documentos.eventos: { kind: domain, owner: document-service, key: documentId }
  extraccion.eventos: { kind: domain, owner: extraction-service, key: documentId }
  revision.eventos: { kind: domain, owner: review-service, key: documentId }
  calidad.eventos: { kind: domain, owner: quality-service, key: documentId }
  notificaciones.eventos: { kind: domain, owner: notification-service, key: documentId }
  idp.tenant.events: { kind: domain, owner: tenant-service, key: tenantId }
  auditoria.senales: { owner: multi, kind: signal, key: tenantId }
  auditoria.control: { owner: multi, kind: control, key: tenantId }

eventTypes:
  documento.recibido: { topic: documentos.eventos, producers: [document-service], key: documentId }
  documento.rechazado: { topic: documentos.eventos, producers: [document-service], key: documentId }
  documento.renderizado: { topic: documentos.eventos, producers: [document-service], key: documentId }
  documento.purgado: { topic: documentos.eventos, producers: [document-service], key: documentId }
  extraccion.solicitada: { topic: documentos.eventos, producers: [document-service], key: documentId }
  extraccion.aprobada: { topic: documentos.eventos, producers: [document-service], key: documentId }

  extraccion.completada: { topic: extraccion.eventos, producers: [extraction-service], key: documentId }
  extraccion.requiere_revision: { topic: extraccion.eventos, producers: [extraction-service], key: documentId }
  ia.ejecucion_registrada: { topic: extraccion.eventos, producers: [extraction-service], key: documentId }

  revision.completada: { topic: revision.eventos, producers: [review-service], key: documentId }
  revision.escalada: { topic: revision.eventos, producers: [review-service], key: documentId }

  calidad.muestra_ciega_solicitada: { topic: calidad.eventos, producers: [quality-service], key: documentId }

  webhook.entregado: { topic: notificaciones.eventos, producers: [notification-service], key: documentId }
  webhook.fallido: { topic: notificaciones.eventos, producers: [notification-service], key: documentId }

  tenant.aprovisionado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  tenant.aprovisionamiento_fallido: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  tenant.baja_iniciada: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  # Reservado (desalojo de pool por rotacion de credenciales, H7): aun sin esquema en el catalogo.
  tenant.credenciales_rotadas: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  acceso.revocado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  acceso.rol_sensible_otorgado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  breakglass.otorgado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  breakglass.expirado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }
  cuota.umbral_alcanzado: { topic: idp.tenant.events, producers: [tenant-service], key: tenantId }

  # Control (auditoria.control): productores explicitos segun el codigo; audit-service los ingiere en la cadena.
  consumo.registrado: { topic: auditoria.control, producers: [tenant-service, extraction-service], key: tenantId }
  legalhold.aplicado: { topic: auditoria.control, producers: [tenant-service, audit-service], key: tenantId }
  legalhold.liberado: { topic: auditoria.control, producers: [tenant-service, audit-service], key: tenantId }
  auditoria.alerta_integridad: { topic: auditoria.control, producers: [audit-service], key: tenantId }
  # Senales (auditoria.senales): multi-productor; audit-service las ingiere como senales, no como estado.
  seguridad.acceso_denegado: { topic: auditoria.senales, producers: [document-service, extraction-service, review-service, quality-service, notification-service, chat-service, tenant-service], key: tenantId }
  seguridad.prompt_injection_detectado: { topic: auditoria.senales, producers: [extraction-service, chat-service], key: tenantId }
  chat.respuesta_bloqueada: { topic: auditoria.senales, producers: [chat-service], key: tenantId }
  chat.respuesta_desde_cache: { topic: auditoria.senales, producers: [chat-service], key: tenantId }
