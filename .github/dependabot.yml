version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
          - "org.springframework.cloud*"
          - "org.springframework.ai*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "terraform"
    directory: "/infra/opentofu/aws"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # Los mayores de provider aws (6), EKS (21) y VPC (6) se acoplan entre sí y exigen reescribir
    # el módulo; se migran juntos en F8 validando con `tofu validate`.
    ignore:
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
      - dependency-name: "terraform-aws-modules/*"
        update-types: ["version-update:semver-major"]
