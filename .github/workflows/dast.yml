name: DAST (ZAP Pentest)

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2AM
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ZAP Scan (Baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          # Debe configurarse contra el entorno de staging desplegado
          target: 'https://gateway.staging.local/'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false
