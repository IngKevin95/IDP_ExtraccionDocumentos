management.endpoint.health.probes.enabled=true
spring.kafka.listener.auto-startup=false
idp.review.relay.enabled=false
idp.review.escalation.enabled=false
idp.tenant-db.jdbc-url-template=jdbc:h2:mem:{tenant};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
idp.tenant-db.username=sa
idp.tenant-db.password=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://idp.test/tenants
idp.security.audience=review-service
idp.review.crop-secret=test-crop-secret-that-is-at-least-32-bytes-long
idp.review.max-escalation-level=2
idp.security.dev-mode=true
idp.review.public-base-url=http://localhost:8080
idp.review.crop-rate-per-minute=1000
idp.openbao.address=
