management.endpoint.health.probes.enabled=true
spring.kafka.listener.auto-startup=false
idp.notification.relay.enabled=false
idp.notification.worker.enabled=false
idp.notification.allow-insecure-http=true
idp.tenant-db.jdbc-url-template=jdbc:h2:mem:{tenant};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
idp.tenant-db.username=sa
idp.tenant-db.password=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://idp.test/tenants
idp.security.audience=notification-service
idp.security.dev-mode=true
idp.openbao.address=
idp.notification.host-verification=none
idp.notification.worker.max-per-tenant=1
idp.notification.breaker.minimum-calls=1000
idp.notification.breaker.sliding-window-size=1000
