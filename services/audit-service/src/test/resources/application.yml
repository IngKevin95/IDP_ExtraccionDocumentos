spring:
  datasource:
    url: jdbc:h2:mem:auditdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS VARCHAR(100000)
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    table: flyway_audit_history
    locations: classpath:db/migration/common,classpath:db/migration/{vendor},classpath:db/testmigration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/jwks
          issuer-uri: https://idp.test/tenants
  autoconfigure:
    exclude: org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

idp:
  audit:
    topics: dominio.documentos,auditoria.eventos
    alerts-topic: auditoria.eventos
    signing-key-id: audit-signing
    anchor:
      job-enabled: false
      batch-size: 1000
      max-age-hours: 24
    worm:
      retention-days: 3650
  security:
    dev-mode: true
    audience: audit-service
