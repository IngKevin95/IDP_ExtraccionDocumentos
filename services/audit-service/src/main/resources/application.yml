spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:control_db}
    # SEC-021: El rol de BD configurado aqui (DB_USER) no debe tener permisos de UPDATE ni DELETE
    # sobre la tabla audit_entries, garantizando la inmutabilidad a nivel de base de datos.
    username: ${DB_USER}
    password: ${DB_PASS}
  flyway:
    enabled: true
    # La base de control es compartida: historial propio para no chocar con otros servicios.
    table: flyway_audit_history
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/idp/protocol/openid-connect/certs}
          # Obligatorio y sin default: el arranque falla si falta (A2).
          issuer-uri: ${JWT_ISSUER_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      # mTLS (Strimzi KafkaUser): definir spring.kafka.ssl.bundle (SPRING_KAFKA_SSL_BUNDLE). PLAINTEXT solo con idp.security.dev-mode=true.
      protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
    consumer:
      group-id: ${AUDIT_CONSUMER_GROUP:audit-service}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8088
  # Tomcat resuelve la IP del cliente desde X-Forwarded-For (RemoteIpValve): request.getRemoteAddr() ya es la IP
  # real. Es seguro porque solo el edge-gateway alcanza este pod (NetworkPolicy ingress en deploy/helm); sin esa
  # restriccion el header seria falsificable y el limite por IP eludible.
  forward-headers-strategy: native

idp:
  security:
    audience: ${JWT_AUDIENCE:audit-service}
  audit:
    # Sin valor: consume todos los topicos de contracts/events/topology.yaml (consumer group propio, reintento
    # bloqueante). AUDIT_TOPICS lo restringe (lista separada por comas).
    signing-key-id: ${AUDIT_SIGNING_KEY_ID:audit-signing}
    anchor:
      job-enabled: ${AUDIT_ANCHOR_JOB_ENABLED:true}
      interval-ms: 60000
      batch-size: 1000
      # Ventana maxima de anclaje (H11): 1 h por defecto.
      max-age-hours: ${AUDIT_ANCHOR_MAX_AGE_HOURS:1}
      # Alerta (metrica audit.worm.unanchored_alert) si los eventos sin anclar superan este umbral.
      alert-threshold: ${AUDIT_ANCHOR_ALERT_THRESHOLD:5000}
    worm:
      retention-days: ${AUDIT_WORM_RETENTION_DAYS:3650}
      bucket: ${AUDIT_WORM_BUCKET:}
      endpoint: ${AUDIT_WORM_ENDPOINT:}
      region: ${AUDIT_WORM_REGION:us-east-1}
      access-key: ${AUDIT_WORM_ACCESS_KEY:}
      secret-key: ${AUDIT_WORM_SECRET_KEY:}
      path-style: ${AUDIT_WORM_PATH_STYLE:true}
    kms:
      openbao:
        address: ${OPENBAO_ADDR:}
        token: ${OPENBAO_TOKEN:}
        transit-mount: ${OPENBAO_TRANSIT_MOUNT:transit}
    revalidation:
      cache-ttl-seconds: 30
    public-verify:
      max-body-bytes: ${AUDIT_PUBLIC_VERIFY_MAX_BODY_BYTES:1048576}
      rate-per-minute: ${AUDIT_PUBLIC_VERIFY_RATE_PER_MINUTE:30}
      # Tope global (todas las IPs) contra abuso distribuido.
      global-rate-per-minute: ${AUDIT_PUBLIC_VERIFY_GLOBAL_RATE_PER_MINUTE:600}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
