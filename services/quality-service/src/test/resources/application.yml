server:
  port: 0
spring:
  application:
    name: quality-service
  datasource:
    url: jdbc:h2:mem:quality_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:1/jwks
          issuer-uri: https://idp.test/tenants
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      group-id: quality-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
idp:
  security:
    audience: quality-service
    dev-mode: true
quality:
  current-model-prompt: modelo-a/prompt-v1
  blind-sampling:
    rate: 0
    seed: test-seed
  drift:
    silent-error-max: 0.05
    stp-drop-points: 10
    baseline-days: 7
    min-samples: 5
  performance:
    min-sample: 5
  calibration:
    target-auto: 0.9
    target-revisar: 0.7
    min-field-samples: 10
  scheduler:
    enabled: false
