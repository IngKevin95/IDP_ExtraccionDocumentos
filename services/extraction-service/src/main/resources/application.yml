server:
  port: 8080
spring:
  application:
    name: extraction-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      # mTLS (Strimzi KafkaUser): definir spring.kafka.ssl.bundle (SPRING_KAFKA_SSL_BUNDLE). PLAINTEXT solo con idp.security.dev-mode=true.
      protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
    consumer:
      group-id: extraction-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  flyway:
    # El esquema del silo lo aplica tenant-context por tenant (db/migration/tenant), no el arranque del servicio.
    enabled: false
  ai:
    model:
      # Seleccione el proveedor por despliegue: google-genai (Vertex AI Gemini) u openai (compatible con OpenAI).
      chat: ${EXTRACTION_AI_PROVIDER:none}
      # Solo se usa el modelo de chat multimodal; el resto de capacidades de los starters quedan apagadas.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      # El DataSource es enrutado por tenant: sin tenant en contexto no hay conexion que sondear.
      enabled: false
extraction:
  openbao:
    token: ${OPENBAO_TOKEN:}
  storage:
    access-key: ${EXTRACTION_S3_ACCESS_KEY:}
    secret-key: ${EXTRACTION_S3_SECRET_KEY:}
# Las autoconfiguraciones de libs/storage-port y libs/kms-port leen idp.*; aqui se alimentan de las propiedades
# extraction.* existentes. El proveedor (idp.storage.provider, idp.kms.provider) llega por IDP_STORAGE_PROVIDER e
# IDP_KMS_PROVIDER y es obligatorio con base de control definida.
idp:
  control-db:
    url: ${extraction.control.url:}
  storage:
    endpoint: ${extraction.storage.endpoint:}
    region: ${extraction.storage.region:us-east-1}
    access-key: ${extraction.storage.access-key:}
    secret-key: ${extraction.storage.secret-key:}
    path-style: ${extraction.storage.path-style:true}
  openbao:
    address: ${extraction.openbao.address:http://openbao:8200}
    token: ${extraction.openbao.token:}
    transit-mount: ${extraction.openbao.transit-mount:transit}
    ssl-bundle: ${extraction.openbao.ssl-bundle:}
