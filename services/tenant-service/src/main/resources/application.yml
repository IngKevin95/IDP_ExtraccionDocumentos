spring:
  application:
    name: tenant-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tenant_db}
    username: ${DB_USER}
    password: ${DB_PASS}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/idp/protocol/openid-connect/certs}
          # Obligatorio y sin default: el arranque falla si falta (A2).
          issuer-uri: ${JWT_ISSUER_URI}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      # mTLS (Strimzi KafkaUser): definir spring.kafka.ssl.bundle (SPRING_KAFKA_SSL_BUNDLE). PLAINTEXT solo con idp.security.dev-mode=true.
      protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8081

idp:
  security:
    audience: ${JWT_AUDIENCE:tenant-service}
    # Emisor de plataforma distinto del de tenants (A3); obligatorio.
    platform-issuer: ${JWT_PLATFORM_ISSUER}
    platform-jwk-set-uri: ${JWT_PLATFORM_JWK_SET_URI:}
  tenant:
    offboarding:
      grace-days: ${OFFBOARDING_GRACE_DAYS:30}
      job-enabled: ${OFFBOARDING_JOB_ENABLED:true}
      job-interval-ms: 3600000
    breakglass:
      max-ttl-minutes: 480
      expiry-job-enabled: ${BREAKGLASS_EXPIRY_JOB_ENABLED:true}
    certification:
      signing-key-id: ${CERT_SIGNING_KEY_ID:access-certification}
    revalidation:
      cache-ttl-seconds: 30
    quota:
      alert-threshold-percent: 80
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
