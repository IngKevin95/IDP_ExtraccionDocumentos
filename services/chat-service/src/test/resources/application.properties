management.endpoint.health.probes.enabled=true
spring.kafka.listener.auto-startup=false
spring.kafka.security.protocol=PLAINTEXT
idp.security.dev-mode=true
idp.security.audience=chat-service
idp.chat.relay.enabled=false
idp.chat.embedding-dimension=8
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://idp.test/tenants
spring.ai.model.chat=none
spring.ai.model.embedding=none
idp.openbao.address=
idp.tenant-db.max-pools=100
